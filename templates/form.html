{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h1>{{ titulo }}</h1>

<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn">Salvar</button>
  <a href="{{ voltar }}" class="btn btn-sec">Cancelar</a>
</form>
{% endblock %}
