{% extends "base.html" %}
{% block title %}Apagar{% endblock %}

{% block content %}
<h1>Apagar</h1>
<p>Tem certeza que deseja apagar <strong>{{ object }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-perigo">Sim, apagar</button>
  <a href="{{ voltar }}" class="btn btn-sec">Cancelar</a>
</form>
{% endblock %}
